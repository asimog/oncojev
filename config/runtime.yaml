mode: live
block:
  default_seconds: 900
  handoff_reserve_seconds: 90
  max_tool_calls: 500
  max_model_requests: 200
  max_source_calls: 100
  max_jev_calls: 100
  max_reasoner_calls: 10
  max_sandbox_calls: 5
  max_download_bytes: 100000000
  max_cost: null
director:
  retrieval_k: 20
  semantic_frontier_k: 8
oncolab:
  search_k: 20
jev:
  search_k: 20
sandbox:
  provider: docker
  image: python:3.12-slim
  cpu: 2
  memory_mb: 4096
  timeout_seconds: 300
