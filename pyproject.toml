[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oncojev"
version = "0.1.0"
description = "Autonomous computational oncology research system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "pydantic-ai>=1.0",
  "PyYAML>=6.0",
  "typesafe-sdk[http2]>=0.7.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/oncojev"]
